- insert:
    - id: a-share-screener
      name: '@local/a-share-screener'
      config:
        provider: 'westock'
        cli:
          package: 'westock-data-clawhub@1.0.4'
          command: 'npx'
          extraArgs: ['-y']
          timeoutMs: 60000
        includeFundamentals: true
        excludeST: true
        excludeBoards: ['kcb', 'bj']
        defaultScanLimit: 40
        defaultTopN: 20
        indexCode: 'sh000001'
